name: Bug report
description: Something in FM1-800 doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue, with the steps that make it happen.
  - type: input
    id: version
    attributes:
      label: FM1-800 version
      description: Shown at the bottom of the screen for a few seconds after switching on
      placeholder: "v0.12.4"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
